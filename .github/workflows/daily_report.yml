name: 生成并发布中文日报

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  publish-report:
    runs-on: ubuntu-24.04

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查 Python 语法
        run: python -m py_compile main.py publish_issue.py tests/test_recommendations.py

      - name: 验证用途分类和人群建议
        run: python -m unittest discover -s tests -v

      - name: 生成中文日报
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: 同步为 Gmeek 文章 Issue
        id: publish_issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python publish_issue.py

      - name: 提交日报文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/

          if git diff --cached --quiet; then
            echo "日报文件没有变化，无需提交。"
          else
            git commit -m "docs: 发布中文 AI Agent 与 MCP 日报 [skip ci]"
            git push origin HEAD:main
          fi

      - name: 触发 Gmeek 构建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run Gmeek.yml --ref main

      - name: 输出文章地址
        run: echo "${{ steps.publish_issue.outputs.issue_url }}"
