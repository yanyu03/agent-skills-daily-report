name: 生成并发布中文日报

on:
  schedule:
    # UTC 22:17 = 北京时间次日 06:17，避开整点拥堵并为 08:00 前发布留出缓冲。
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: daily-report-production
  cancel-in-progress: false

jobs:
  publish-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出 Python 源码分支
        uses: actions/checkout@v6
        with:
          ref: py
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查 Python 语法
        run: |
          python -m py_compile \
            main.py \
            skill_analysis.py \
            publish_issue.py \
            tests/test_recommendations.py \
            tests/test_skill_analysis.py

      - name: 验证仓库与 Skill 分析规则
        run: python -m unittest discover -s tests -v

      - name: 生成中文日报
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: 提交日报到 py 分支
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/

          if git diff --cached --quiet; then
            echo "日报文件没有变化，无需提交。"
          else
            git commit -m "docs: 发布中文 AI Agent 与 MCP 日报 [skip ci]"
            git pull --rebase --autostash origin py
            git push origin HEAD:py
          fi

      - name: 同步为 Gmeek 文章 Issue
        id: publish_issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python publish_issue.py

      # GITHUB_TOKEN 创建的 Issue 不会继续触发新的工作流，因此这里显式启动 Gmeek。
      - name: 触发 Gmeek 构建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run Gmeek.yml --ref main

      - name: 输出文章地址
        run: echo "${{ steps.publish_issue.outputs.issue_url }}"
