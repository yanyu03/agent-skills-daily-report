name: 构建并部署 Gmeek 中文博客

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]

concurrency:
  group: gmeek-blog-output
  cancel-in-progress: true

jobs:
  build:
    name: 从 py 构建并写入 blog
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event_name != 'issues' || github.event.issue.user.id == github.event.repository.owner.id }}
    permissions:
      contents: write
      issues: write

    steps:
      - name: 检出 Python 源码分支
        uses: actions/checkout@v6
        with:
          ref: py
          fetch-depth: 0

      - name: 检出博客产物分支
        uses: actions/checkout@v6
        with:
          ref: blog
          path: blog-site
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 校验 Gmeek 配置
        run: |
          python -m json.tool config.json > /dev/null
          cat config.json

      - name: 获取 Gmeek 源码
        run: |
          git clone https://github.com/Meekdai/Gmeek.git /opt/Gmeek
          GMEEK_VERSION=$(python -c "import json; print(json.load(open('config.json', encoding='utf-8'))['GMEEK_VERSION'])")
          cd /opt/Gmeek
          if [ "$GMEEK_VERSION" = "last" ]; then
            LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)")
            git checkout "$LATEST_TAG"
          else
            git checkout "$GMEEK_VERSION"
          fi

      - name: 安装 Gmeek 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r /opt/Gmeek/requirements.txt

      - name: 生成静态站点
        run: |
          set -euo pipefail

          # py 分支提供源码和配置；blog 分支提供上一次构建缓存。
          rsync -a --exclude='.git' --exclude='.github' --exclude='blog-site' ./ /opt/Gmeek/
          [ ! -d blog-site/docs ] || cp -a blog-site/docs /opt/Gmeek/docs
          [ ! -d blog-site/backup ] || cp -a blog-site/backup /opt/Gmeek/backup
          [ ! -f blog-site/blogBase.json ] || cp blog-site/blogBase.json /opt/Gmeek/blogBase.json
          [ ! -f blog-site/.gmeek-config.sha256 ] || cp blog-site/.gmeek-config.sha256 /opt/Gmeek/.gmeek-config.sha256

          cd /opt/Gmeek
          current_config_hash=$(sha256sum config.json | awk '{print $1}')
          cached_config_hash=$(cat .gmeek-config.sha256 2>/dev/null || true)

          if [ "${current_config_hash}" != "${cached_config_hash}" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Gmeek 配置发生变化，执行全量重建。"
            rm -f blogBase.json
          else
            echo "Gmeek 配置未变化，执行增量构建。"
          fi

          echo "${current_config_hash}" > .gmeek-config.sha256
          issue_number="${{ github.event.issue.number }}"
          if [ -n "${issue_number}" ]; then
            python Gmeek.py "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}" --issue_number "${issue_number}"
          else
            python Gmeek.py "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}"
          fi

          if [ -f _headers ]; then
            cp _headers docs/_headers
          fi

          # blog 分支只保留构建产物，不混入 Python 源码。
          find "${{ github.workspace }}/blog-site" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a docs "${{ github.workspace }}/blog-site/docs"
          cp -a backup "${{ github.workspace }}/blog-site/backup"
          cp blogBase.json "${{ github.workspace }}/blog-site/README.md"
          cp .gmeek-config.sha256 "${{ github.workspace }}/blog-site/.gmeek-config.sha256"
          touch "${{ github.workspace }}/blog-site/.nojekyll"

      - name: 提交生成结果到 blog 分支
        working-directory: blog-site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short

          if git diff --cached --quiet; then
            echo "站点内容没有变化，无需提交。"
          else
            git commit -m "chore: 更新 Gmeek 中文站点 [skip ci]"
            git pull --rebase --autostash origin blog
            git push origin HEAD:blog
          fi

      - name: 上传 GitHub Pages 构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: blog-site/docs/.

  deploy:
    name: 部署 GitHub Pages 备用站
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 部署站点
        id: deployment
        uses: actions/deploy-pages@v5
