name: 构建并部署 Gmeek 中文博客

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "15 16 * * *"

concurrency:
  group: gmeek-pages
  cancel-in-progress: false

jobs:
  build:
    name: 生成中文博客
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'issues' || github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write
      issues: read
      pages: write
      id-token: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: 校验 Gmeek 配置
        run: |
          python -m json.tool config.json > /dev/null
          cat config.json

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 获取 Gmeek 源码
        run: |
          git clone https://github.com/Meekdai/Gmeek.git /opt/Gmeek
          GMEEK_VERSION=$(python -c "import json; print(json.load(open('config.json', encoding='utf-8'))['GMEEK_VERSION'])")
          cd /opt/Gmeek
          if [ "$GMEEK_VERSION" = "last" ]; then
            LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)")
            git checkout "$LATEST_TAG"
          else
            git checkout "$GMEEK_VERSION"
          fi

      - name: 安装 Gmeek 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r /opt/Gmeek/requirements.txt

      - name: 生成静态站点
        run: |
          rsync -a --exclude='.git' --exclude='.github' ./ /opt/Gmeek/
          cd /opt/Gmeek
          python Gmeek.py "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}" --issue_number "${{ github.event.issue.number }}"

          rm -rf "${{ github.workspace }}/docs" "${{ github.workspace }}/backup"
          cp -a /opt/Gmeek/docs "${{ github.workspace }}/docs"
          cp -a /opt/Gmeek/backup "${{ github.workspace }}/backup"
          cp /opt/Gmeek/blogBase.json "${{ github.workspace }}/blogBase.json"

      - name: 提交生成结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs backup blogBase.json

          if git diff --cached --quiet; then
            echo "站点内容没有变化，无需提交。"
          else
            git commit -m "chore: 更新 Gmeek 中文站点 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.

  deploy:
    name: 部署 GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署站点
        id: deployment
        uses: actions/deploy-pages@v5
