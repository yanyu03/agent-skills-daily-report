name: 部署到 Cloudflare Pages

on:
  workflow_run:
    workflows: ["构建并部署 Gmeek 中文博客"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

env:
  CF_PAGES_PROJECT: agent-skills-daily-report
  CF_CUSTOM_DOMAIN: skill.250221.xyz

jobs:
  deploy:
    name: 发布静态站点并绑定域名
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: 检出最新站点文件
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 检查 Cloudflare 凭据
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::请在仓库 Actions secrets 中配置 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID。"
            exit 1
          fi

      - name: 校验静态站点目录
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/postList.json
          echo "准备部署 $(find docs -type f | wc -l) 个文件。"

      - name: 部署到 Cloudflare Pages
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=agent-skills-daily-report --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 绑定自定义域名
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ env.CF_PAGES_PROJECT }}
          CUSTOM_DOMAIN: ${{ env.CF_CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          api_base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains"

          domains_json=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${api_base}")

          echo "${domains_json}" | jq -e '.success == true' > /dev/null

          if echo "${domains_json}" | jq -e --arg domain "${CUSTOM_DOMAIN}" \
            'any(.result[]?; .name == $domain)' > /dev/null; then
            echo "自定义域名 ${CUSTOM_DOMAIN} 已关联，无需重复添加。"
          else
            add_domain_json=$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${CUSTOM_DOMAIN}\"}" \
              "${api_base}")

            echo "${add_domain_json}" | jq -e '.success == true' > /dev/null
            echo "已提交自定义域名 ${CUSTOM_DOMAIN}。"
          fi

          domain_json=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${api_base}/${CUSTOM_DOMAIN}")

          echo "域名状态：$(echo "${domain_json}" | jq -r '.result.status // "unknown"')"
          echo "站点地址：https://${CUSTOM_DOMAIN}/"

      - name: 输出部署地址
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
        run: |
          echo "Cloudflare Pages 部署地址：${DEPLOYMENT_URL}"
          echo "自定义域名：https://${CF_CUSTOM_DOMAIN}/"
