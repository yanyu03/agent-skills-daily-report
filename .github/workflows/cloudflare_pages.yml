name: 部署到 Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

env:
  CF_PAGES_PROJECT: agent-skills-daily-report
  CF_PAGES_PRODUCTION_BRANCH: blog

jobs:
  deploy:
    name: 从 blog 分支发布静态站点
    runs-on: ubuntu-24.04

    steps:
      - name: 检出博客产物分支
        uses: actions/checkout@v6
        with:
          ref: blog
          fetch-depth: 1

      - name: 检查 Cloudflare 凭据
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::请在仓库 Actions secrets 中配置 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID。"
            exit 1
          fi

      - name: 创建或校验 Cloudflare Pages 项目
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ env.CF_PAGES_PROJECT }}
          PRODUCTION_BRANCH: ${{ env.CF_PAGES_PRODUCTION_BRANCH }}
        run: |
          set -euo pipefail
          api_base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          project_url="${api_base}/${PROJECT_NAME}"
          project_file="${RUNNER_TEMP}/cloudflare-pages-project.json"

          http_status=$(curl --silent --show-error \
            --output "${project_file}" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${project_url}")

          case "${http_status}" in
            200)
              jq -e '.success == true' "${project_file}" > /dev/null
              actual_branch=$(jq -r '.result.production_branch // ""' "${project_file}")
              if [ "${actual_branch}" != "${PRODUCTION_BRANCH}" ]; then
                echo "::error::Pages 项目 ${PROJECT_NAME} 的生产分支是 ${actual_branch:-未设置}，预期为 ${PRODUCTION_BRANCH}。"
                echo "请在 Cloudflare Pages 项目设置中改为 ${PRODUCTION_BRANCH} 后重试。"
                exit 1
              fi
              echo "Pages 项目 ${PROJECT_NAME} 已存在，生产分支为 ${PRODUCTION_BRANCH}。"
              ;;
            404)
              create_response=$(curl --fail-with-body --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$(jq -nc --arg name "${PROJECT_NAME}" --arg branch "${PRODUCTION_BRANCH}" \
                  '{name: $name, production_branch: $branch}')" \
                "${api_base}")
              echo "${create_response}" | jq -e '.success == true' > /dev/null
              echo "已创建 Pages 项目 ${PROJECT_NAME}，生产分支为 ${PRODUCTION_BRANCH}。"
              ;;
            *)
              echo "::error::无法读取 Pages 项目 ${PROJECT_NAME}（HTTP ${http_status}）。"
              cat "${project_file}"
              exit 1
              ;;
          esac

      - name: 校验静态站点目录
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/postList.json
          echo "准备从 blog 分支部署 $(find docs -type f | wc -l) 个文件。"

      - name: 部署到 Cloudflare Pages
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=agent-skills-daily-report --branch=blog
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出部署地址
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
        run: |
          echo "Cloudflare Pages 部署地址：${DEPLOYMENT_URL}"
